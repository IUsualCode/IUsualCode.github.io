<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт тонировки</title>
<style>
:root{--bg:#f1f1ef;--cd:#fff;--tx:#17171a;--mu:#6c6c70;--ac:#b08d1e;--bd:#dedcd6;--ok:#2e7d32;--bad:#c62828;--wn:#d17b00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--cd:#161616;--tx:#ececec;--mu:#9d9da2;--ac:#d4af37;--bd:#2a2a2a;--ok:#66bb6a;--bad:#ef5350;--wn:#ffb74d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--cd:#161616;--tx:#ececec;--mu:#9d9da2;--ac:#d4af37;--bd:#2a2a2a;--ok:#66bb6a;--bad:#ef5350;--wn:#ffb74d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:78px}
[hidden]{display:none!important}
#main{max-width:640px;margin:0 auto;padding:14px}
h2{font-size:20px;margin:6px 0}h3{font-size:15px;margin:18px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin:8px 0}
.tap{cursor:pointer}.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g5{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 34px;gap:5px;margin:5px 0}
.kp{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:6px;padding:9px 11px}.kp b{display:block;font-size:19px}
.big{border-left-color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:right;color:var(--mu);font-weight:500;padding:4px}td{text-align:right;padding:6px 4px;border-top:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;margin-top:3px}
.btn{background:var(--ac);color:#111;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;margin-top:12px;cursor:pointer}
.g2 .btn,.dn{width:100%}.gh{background:transparent;color:var(--tx);border:1px solid var(--bd)}.dn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.x{background:none;border:0;color:var(--bad);font-size:18px}
.pv{background:var(--bg);border-radius:8px;padding:10px;margin-top:12px;font-size:14px}.pv div{display:flex;justify-content:space-between}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:8px 0 7px;cursor:pointer}#nav b{display:block;font-size:19px;font-weight:400}#nav .on{color:var(--ac);font-weight:700}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}.bk{position:absolute;inset:0;background:#0009}
.pan{position:relative;background:var(--cd);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:30;font-size:14px}
</style></head><body>
<div id="main"></div><nav id="nav"></nav><div id="sheet" hidden><div class="bk" onclick="shut()"></div><div class="pan" id="pan"></div></div><div id="toast" hidden></div>
<script>
const KEY="pb_tint_v1",$=s=>document.querySelector(s),E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=v=>+v||0,fmt=n=>Math.round(n).toLocaleString("ru-RU"),f1=n=>(Math.round(n*10)/10).toLocaleString("ru-RU"),fd=d=>d?d.split("-").reverse().join("."):"";
const tod=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const opts=(a,s)=>a.map(x=>`<option${x===s?" selected":""}>${E(x)}</option>`).join("");
const D={rate:11.5,minStock:5,bodies:[["Седан",2,1.5,1.5],["Купе",2,1.5,1.5],["Хэтчбек",2,1.5,1.5],["Универсал",2.5,1.5,1.5],["Кроссовер",2.5,1.5,1.8],["Внедорожник",3,1.8,2],["Минивэн",3.5,2,2],["Пикап",1.5,1.5,1.5]],
svcs:[["Задняя полусфера","rear",0,4500],["Передняя полусфера","front",0,4500],["Лобовое стекло","wind",0,2000],["Полировка фар","",0,1500],["Бронирование фар","",0,2500],["Прочее","",0,0]],
pays:["Наличные","Перевод","Карта"],srcs:["Реклама в соцсетях","Сарафан","Повторный клиент","Проходящий"],cats:["Реклама","Аренда","Электричество и отопление","Расходники и инструмент","Оборудование","Зарплата","Налоги","Прочее"],films:[],jobs:[],exps:[]};
let S,ok=true,tab="sum",Y=new Date().getFullYear(),EJ=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.jobs)S=JSON.parse(JSON.stringify(D));const mig=()=>{if(!S.wh)S.wh=[9,20];S.jobs.forEach(j=>{if(!j.items)j.items=[{svc:j.svc,film:j.film,m:N(j.m),sale:N(j.sale),cost:N(j.cost),work:N(j.work)}]})};mig();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false;toast("Память браузера недоступна — данные не сохранятся")}};
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(window._t);window._t=setTimeout(()=>e.hidden=true,2400)}
const cost=f=>N(f.yuan)*(N(f.rate)||S.rate)+N(f.dl),perM=f=>N(f.len)>0?cost(f)/f.len:0,used=n=>S.jobs.filter(j=>j.st!=="plan").reduce((a,j)=>a+j.items.filter(i=>i.film===n).reduce((b,i)=>b+N(i.m),0),0),left=f=>N(f.len)-used(f.name);
const jm=j=>{const t=j.items.reduce((a,i)=>a+N(i.m)*N(i.sale)+N(i.work),0)-N(j.disc),c=j.items.reduce((a,i)=>a+N(i.m)*N(i.cost),0);return{total:t,cost:c,profit:t-c-N(j.other)}},svn=j=>j.items.map(i=>i.svc).join(", ");
function cons(b,s){const v=S.svcs.find(x=>x[0]===s);if(!v)return 0;if(!v[1])return N(v[2]);const x=S.bodies.find(y=>y[0]===b);return x?N(x[{rear:1,front:2,wind:3}[v[1]]]):0}
const TABS=[["sum","📊","Сводка"],["book","📅","Запись"],["jobs","🧾","Журнал"],["films","🎞️","Плёнки"],["exps","💸","Расходы"],["set","⚙️","Настройки"]];
function go(t){tab=t;render();scrollTo(0,0)}
function render(){$("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");$("#main").innerHTML=(tab==="sum"||tab==="book"?banner():"")+{sum:vSum,book:vBook,jobs:vJobs,films:vFilms,exps:vExps,set:vSet}[tab]()}
const pan=h=>{$("#pan").innerHTML=h;$("#sheet").hidden=false},shut=()=>{$("#sheet").hidden=true};
function arm(b,fn){if(b.dataset.a)return fn();b.dataset.a=1;b.textContent="Нажмите ещё раз для удаления";setTimeout(()=>{b.dataset.a="";b.textContent="Удалить"},3000)}
const mn=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const kp=(l,v,c)=>`<div class="kp ${c||""}"><span class="mu">${l}</span><b>${v}</b></div>`;
const tbl=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table></div>`;
const sg=n=>`<span class="${n<0?"bad":""}">${fmt(n)}</span>`;
function vSum(){const P=S;S=Object.assign({},P,{jobs:P.jobs.filter(j=>j.st!=="plan")});try{return vSum0()}finally{S=P}}
function vSum0(){
const ys=new Set([new Date().getFullYear()]);[...S.jobs,...S.exps,...S.films].forEach(x=>x.date&&ys.add(+x.date.slice(0,4)));
const iy=d=>d&&+d.slice(0,4)===Y,M=Array.from({length:12},()=>({n:0,inc:0,cost:0,oth:0,ex:0,buy:0}));
S.jobs.filter(j=>iy(j.date)).forEach(j=>{const m=jm(j),x=M[+j.date.slice(5,7)-1];x.n++;x.inc+=m.total;x.cost+=m.cost;x.oth+=N(j.other)});
S.exps.filter(e=>iy(e.date)).forEach(e=>M[+e.date.slice(5,7)-1].ex+=N(e.sum));
S.films.filter(f=>iy(f.date)).forEach(f=>M[+f.date.slice(5,7)-1].buy+=cost(f));
const T=M.reduce((a,x)=>{for(const k in x)a[k]=(a[k]||0)+x[k];return a},{}),net=x=>x.inc-x.cost-x.oth-x.ex,cash=x=>x.inc-x.buy-x.oth-x.ex;
const grp=(f,ns)=>ns.map(n=>{const r=S.jobs.filter(j=>iy(j.date)&&f(j)===n);return[E(n),r.length,fmt(r.reduce((a,j)=>a+jm(j).total,0)),sg(r.reduce((a,j)=>a+jm(j).profit,0))]});
const sr=grp(j=>j.src,S.srcs),adP=S.jobs.filter(j=>iy(j.date)&&j.src===S.srcs[0]).reduce((a,j)=>a+jm(j).profit,0),adC=S.exps.filter(e=>iy(e.date)&&e.cat===S.cats[0]).reduce((a,e)=>a+N(e.sum),0);
return `<div class="row"><h2>Сводка</h2><select style="width:auto" onchange="Y=+this.value;render()">${[...ys].sort((a,b)=>b-a).map(y=>`<option${y===Y?" selected":""}>${y}</option>`).join("")}</select></div>
<div class="g2" style="margin-top:8px">${kp("Чистая прибыль, ₽",fmt(net(T)),"big")}${kp("Доход, ₽",fmt(T.inc),"big")}${kp("Расходы бизнеса, ₽",fmt(T.ex))}${kp("Закупки плёнки, ₽",fmt(T.buy))}${kp("Движение денег, ₽",fmt(cash(T)))}${kp("Средний чек, ₽",fmt(T.n?T.inc/T.n:0))}</div>
<h3>По месяцам</h3>${tbl(["Месяц","Работ","Доход","Чистая прибыль"],M.map((x,i)=>[mn[i],x.n,fmt(x.inc),sg(net(x))]).concat([["<b>Год</b>",`<b>${T.n}</b>`,`<b>${fmt(T.inc)}</b>`,`<b>${fmt(net(T))}</b>`]]))}
<h3>По услугам</h3>${tbl(["Услуга","Работ","Доход","Прибыль"],gsvc(Y))}
<h3>По источникам клиентов</h3>${tbl(["Источник","Работ","Доход","Прибыль"],sr)}
<div class="card"><b>Окупаемость рекламы</b><div class="mu">Источник «${E(S.srcs[0])}» и расходы «${E(S.cats[0])}»</div><div class="row"><span>Прибыль − затраты</span><b>${fmt(adP-adC)} ₽</b></div><div class="row"><span>Окупаемость</span><b>${adC>0?Math.round((adP-adC)/adC*100)+" %":"—"}</b></div></div>
<p class="mu">Чистая прибыль = доход − себестоимость использованной плёнки − прочие расходы по заказам − расходы бизнеса. Движение денег учитывает плёнку в момент покупки.</p>`}
function vJobs(){const L=[...S.jobs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,300);
return `<div class="row"><h2>Журнал работ</h2><button class="btn" onclick="jobForm()">+ Работа</button></div>`+(L.length?L.map(j=>{const m=jm(j);return `<div class="card tap" onclick="jobForm('${j.id}')"><div class="row"><b>${j.st==="plan"?"🕒 ":""}${E(j.car||"Без названия")}</b><b>${fmt(m.total)} ₽</b></div><div class="row mu"><span>${fd(j.date)}${j.time?" "+j.time:""} · ${E(svn(j))}${j.body?" · "+E(j.body):""}</span><span class="${m.profit<0?"bad":"ok"}">прибыль ${fmt(m.profit)} ₽</span></div><div class="mu">${fl_(j)}</div></div>`}).join(""):`<p class="mu">Пока пусто. Нажмите «+ Работа» и добавьте первую запись.</p>`)}
const pr=(fl,o)=>fl?(o&&o.film===fl.name?[N(o.sale),N(o.cost)]:[N(fl.sale),perM(fl)]):[0,0];
function jobForm(id,pl,tm){const o=S.jobs.find(j=>j.id===id)||null;EJ=o;
const v=o||{date:(pl&&BD)||tod(),time:tm||"",phone:"",st:pl?"plan":"",car:"",body:(S.bodies[0]||[""])[0],disc:0,other:0,hours:pl?3:"",pay:S.pays[0],src:S.srcs[0]};
IT=o?o.items.map(i=>({...i})):[mkIt(S.svcs[0]?S.svcs[0][0]:"",v.body)];const n=(i,l,x)=>`<label>${l}<input type="number" step="any" inputmode="decimal" id="${i}" value="${x}" oninput="jPv()"></label>`;
pan(`<h2>${o?"Работа":"Новая работа"}</h2><div class="g2"><label>Дата<input type="date" id="a_date" value="${v.date}" oninput="jPv()"></label><label>Время<input type="time" id="a_time" value="${v.time||""}" oninput="jPv()"></label></div><div class="g2"><label>Клиент / авто<input id="a_car" value="${E(v.car)}" placeholder="Например, Camry"></label><label>Телефон<input type="tel" id="a_phone" value="${E(v.phone||"")}"></label></div>
<label>Тип кузова<select id="a_body" onchange="jAuto()">${opts(S.bodies.map(b=>b[0]),v.body)}</select></label><div id="its"></div><button class="btn gh" onclick="itAdd()">+ Услуга</button>

<div class="g2">${n("a_disc","Скидка, ₽",v.disc)}${n("a_other","Прочие расходы, ₽",v.other)}${n("a_hours","Длительность, ч",v.hours)}<label>Оплата<select id="a_pay">${opts(S.pays,v.pay)}</select></label></div>
<label>Источник клиента<select id="a_src">${opts(S.srcs,v.src)}</select></label><label>Статус<select id="a_st"><option value="plan"${v.st==="plan"?" selected":""}>Запись (ещё не выполнена)</option><option value=""${v.st==="plan"?"":" selected"}>Выполнена</option></select></label><div class="pv" id="pv"></div>
<div class="g2"><button class="btn" onclick="jSave('${id||""}')">Сохранить</button><button class="btn gh" onclick="shut()">Отмена</button></div>${o&&o.st==="plan"?`<button class="btn" style="width:100%" onclick="$('#a_st').value='';jSave('${id}')">✅ Работа выполнена</button><button class="btn gh" style="width:100%" onclick="calCopy('${id}')">📅 Скопировать для календаря</button>`:""}${o?`<button class="btn dn" onclick="arm(this,()=>{S.jobs=S.jobs.filter(j=>j.id!=='${id}');save();shut();render()})">Удалить</button>`:""}`);
itDraw();jPv()}
function jAuto(){IT.forEach(it=>{const n=mkIt(it.svc,$("#a_body").value);it.m=n.m;it.work=n.work});itDraw();jPv()}
function jPv(){const IP=itPr(),t=IP.t-N($("#a_disc").value),c=IP.c,p=t-c-N($("#a_other").value);
let st=IP.st;
$("#pv").innerHTML=`<div><span>Плёнка для клиента</span><b>${fmt(IP.f)} ₽</b></div><div><span>Итого клиенту</span><b>${fmt(t)} ₽</b></div><div><span>Себестоимость плёнки</span><b>${fmt(c)} ₽</b></div><div><span>Чистая прибыль</span><b class="${p<0?"bad":"ok"}">${fmt(p)} ₽</b></div><div><span>Рентабельность</span><b>${t>0?Math.round(p/t*100):0} %</b></div>${st}${clashTxt()}`}
function jSave(id){const g=k=>$("#a_"+k).value,d=g("date");if(!d||!IT.length||IT.some(i=>!i.svc))return toast("Укажите дату и услугу");if(g("st")==="plan"&&!g("time"))return toast("Для записи укажите время");
const its=IT.map(it=>{const fl=S.films.find(f=>f.name===it.film),[sl,cs]=pr(fl,EJ&&EJ.items.find(x=>x.film===it.film));return{svc:it.svc,film:it.film,m:N(it.m),sale:sl,cost:cs,work:N(it.work)}}),j={id:id||uid(),date:d,car:g("car").trim(),body:g("body"),items:its,disc:N(g("disc")),other:N(g("other")),hours:g("hours"),pay:g("pay"),src:g("src"),time:g("time"),phone:g("phone").trim(),st:g("st")};
if(id)S.jobs=S.jobs.map(x=>x.id===id?j:x);else S.jobs.push(j);save();shut();render();toast("Сохранено")}
let BD="";
const tm=t=>{const a=(t||"0:0").split(":");return +a[0]*60+ +a[1]},hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(Math.round(m%60)).padStart(2,"0"),dur=j=>(N(j.hours)||1)*60;
const dayJ=(d,x)=>S.jobs.filter(j=>j.date===d&&j.time&&j.id!==x).sort((a,b)=>tm(a.time)-tm(b.time));
function clash(d,t,h,x){if(!d||!t)return"";const a=tm(t),b=a+(h||1)*60,c=dayJ(d,x).find(j=>tm(j.time)<b&&tm(j.time)+dur(j)>a);return c?`${c.time}–${hm(tm(c.time)+dur(c))} ${E(c.car)}`:""}
const clashTxt=()=>{const c=clash($("#a_date").value,$("#a_time").value,N($("#a_hours").value),EJ&&EJ.id);return c?`<div class="bad"><span>⚠️ Пересекается с записью ${c}</span></div>`:""};
function shiftD(n){const d=new Date((BD||tod())+"T12:00:00");d.setDate(d.getDate()+n);BD=d.toISOString().slice(0,10);render()}
function vBook(){const d=BD||tod(),L=dayJ(d,""),w0=S.wh[0]*60,w1=S.wh[1]*60,fr=[];let p=w0;
L.forEach(j=>{const a=tm(j.time);if(Math.min(a,w1)-p>=30)fr.push([p,Math.min(a,w1)]);p=Math.max(p,a+dur(j))});if(w1-p>=30)fr.push([p,w1]);
const wd=["вс","пн","вт","ср","чт","пт","сб"][new Date(d+"T12:00:00").getDay()],up=S.jobs.filter(j=>j.st==="plan"&&j.date>d).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,8);
return `<div class="row"><h2>Запись</h2><button class="btn" onclick="jobForm('',1)">+ Запись</button></div>
<div class="row" style="margin-top:8px"><button class="btn gh" style="margin:0" onclick="shiftD(-1)">‹</button><input type="date" style="width:auto;margin:0" value="${d}" onchange="BD=this.value;render()"><button class="btn gh" style="margin:0" onclick="shiftD(1)">›</button></div>
<h3>${fd(d)}, ${wd}</h3><div class="card"><div class="mu">Свободное время (нажмите, чтобы записать)</div>${fr.length?fr.map(x=>`<button class="btn gh" style="margin:6px 6px 0 0" onclick="jobForm('',1,'${hm(x[0])}')">${hm(x[0])}–${hm(x[1])}</button>`).join(""):`<div class="bad">Весь день занят</div>`}</div>
${L.length?L.map(j=>`<div class="card tap" onclick="jobForm('${j.id}')"><div class="row"><b>${j.time}–${hm(tm(j.time)+dur(j))} ${E(j.car||"Без названия")}</b><b>${fmt(jm(j).total)} ₽</b></div><div class="mu">${E(svn(j))}${j.body?" · "+E(j.body):""}${j.phone?" · "+E(j.phone):""}</div><div class="${j.st==="plan"?"wn":"ok"}">${j.st==="plan"?"Запланировано":"Выполнено"}</div></div>`).join(""):`<p class="mu">На этот день записей нет.</p>`}
${up.length?`<h3>Ближайшие записи</h3>`+up.map(j=>`<div class="card tap" onclick="BD='${j.date}';render()"><div class="row"><b>${fd(j.date)} ${j.time}</b><span>${E(j.car||"Без названия")}</span></div><div class="mu">${E(svn(j))}</div></div>`).join(""):""}`}
function banner(){const n=new Date(),mm=n.getHours()*60+n.getMinutes(),lc=x=>new Date(x-n.getTimezoneOffset()*6e4).toISOString().slice(0,10),t=lc(Date.now()),w=lc(Date.now()+864e5),P=d=>S.jobs.filter(j=>j.st==="plan"&&j.date===d).sort((a,b)=>tm(a.time)-tm(b.time)),L=P(t),nx=L.find(j=>tm(j.time)+dur(j)>mm),tw=P(w).length;
return `<div class="card tap" style="border-left:4px solid var(--ac)" onclick="BD='';go('book')"><b>${L.length?"Сегодня записей: "+L.length:"Сегодня записей нет"}</b>${L.length?`<div>${nx?"Ближайшая в "+nx.time+": "+E(nx.car||"без названия")+", "+E(svn(nx)):"Все записи на сегодня уже прошли"}</div>`:""}<div class="mu">Завтра записей: ${tw}</div>${S.jobs.length&&(!S.bk||Date.now()-new Date(S.bk)>6048e5)?`<div class="wn">Сделайте резервную копию: Настройки → Выгрузка файлов</div>`:""}</div>`}
function cp(t){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();let r=false;try{r=document.execCommand("copy")}catch(e){}a.remove();if(r)toast("Скопировано. Вставьте в чат с Claude");else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Скопировано. Вставьте в чат с Claude"),()=>toast("Не удалось скопировать"));else toast("Не удалось скопировать")}
function calCopy(id){const j=S.jobs.find(x=>x.id===id);if(!j)return;cp(`Добавь в календарь iPhone: ${fd(j.date)} ${j.time}–${hm(tm(j.time)+dur(j))}, ${j.car||"клиент"}${j.phone?", тел. "+j.phone:""}, ${svn(j)}${j.body?" ("+j.body+")":""}. Напомни за час.`)}
let IT=[];

const gsvc=y=>S.svcs.map(s=>{let n=0,t=0,p=0;S.jobs.forEach(j=>{if(+j.date.slice(0,4)===y)j.items.forEach(i=>{if(i.svc===s[0]){n++;const v=N(i.m)*N(i.sale)+N(i.work);t+=v;p+=v-N(i.m)*N(i.cost)}})});return[E(s[0]),n,fmt(t),sg(p)]});
function itDraw(){$("#its").innerHTML=IT.map((it,i)=>`<div class="card"><div class="row"><select onchange="itSvc(${i},this.value)">${opts(S.svcs.map(s=>s[0]),it.svc)}</select>${IT.length>1?`<button class="x" onclick="IT.splice(${i},1);itDraw();jPv()">✕</button>`:""}</div><label>Плёнка<select onchange="IT[${i}].film=this.value;jPv()"><option value="">— без плёнки —</option>${opts(S.films.map(f=>f.name),it.film)}</select></label><div class="g2"><label>Расход, м<input type="number" step="any" inputmode="decimal" value="${it.m}" oninput="IT[${i}].m=N(this.value);jPv()"></label><label>Работа, ₽<input type="number" step="any" inputmode="decimal" value="${it.work}" oninput="IT[${i}].work=N(this.value);jPv()"></label></div></div>`).join("")}
const itSvc=(i,s)=>{const f=IT[i].film;IT[i]=mkIt(s,$("#a_body").value);IT[i].film=f;itDraw();jPv()},itAdd=()=>{IT.push(mkIt(S.svcs[0]?S.svcs[0][0]:"",$("#a_body").value));itDraw();jPv()};
function itPr(){let t=0,c=0,f=0,st="";const nd={};IT.forEach(it=>{const fl=S.films.find(x=>x.name===it.film),[sl,cs]=pr(fl,EJ&&EJ.items.find(x=>x.film===it.film)),m=N(it.m);f+=m*sl;t+=m*sl+N(it.work);c+=m*cs;if(fl)nd[fl.name]=(nd[fl.name]||0)+m});
for(const k in nd){const fl=S.films.find(x=>x.name===k),l=left(fl)+(EJ&&EJ.st!=="plan"?EJ.items.filter(x=>x.film===k).reduce((a,x)=>a+N(x.m),0):0);st+=l>=nd[k]?`<div class="ok"><span>Остаток ${E(k)} после работы</span><b>${f1(l-nd[k])} м</b></div>`:`<div class="bad"><span>Не хватает ${E(k)} (остаток ${f1(l)} м)</span></div>`}return{t,c,f,st}}
function vFilms(){return `<div class="row"><h2>Плёнки</h2><button class="btn" onclick="filmForm()">+ Плёнка</button></div>`+(S.films.length?S.films.map(f=>{const l=left(f),c=l<=0?["bad","Закончилась"]:l<=S.minStock?["wn","Заканчивается"]:["ok","В наличии"],pm=perM(f);return `<div class="card tap" onclick="filmForm('${f.id}')"><div class="row"><b>${E(f.name)}</b><b class="${c[0]}">${f1(l)} м</b></div><div class="row mu"><span>Себестоимость 1 м: ${fmt(pm)} ₽</span><span class="${c[0]}">${c[1]}</span></div><div class="row mu"><span>Продажа 1 м: ${fmt(N(f.sale))} ₽ (наценка ${pm>0?Math.round((N(f.sale)/pm-1)*100):0} %)</span><span>${fd(f.date)}</span></div></div>`}).join(""):`<p class="mu">Добавьте рулон: цена в юанях, метраж, вес и доставка — себестоимость посчитается сама.</p>`)}
function filmForm(id){const o=S.films.find(f=>f.id===id)||null,v=o||{date:tod(),name:"",yuan:"",len:"",kg:"",dl:"",rate:"",sale:""};

<div class="g2"><button class="btn" onclick="fSave('${id||""}')">Сохранить</button><button class="btn gh" onclick="shut()">Отмена</button></div>${o?`<button class="btn dn" onclick="arm(this,()=>fDel('${id}'))">Удалить</button>`:""}`);fPv()}

if(!nm||N(g("len"))<=0)return toast("Укажите название и метраж");if(S.films.some(f=>f.name===nm&&f.id!==id))return toast("Такое название уже есть — добавьте «№2»");
const f={id:id||uid(),date:g("date"),name:nm,yuan:N(g("yuan")),len:N(g("len")),kg:N(g("kg")),dl:N(g("dl")),rate:N(g("rate"))||"",sale:N(g("sale"))};
if(old){if(old.name!==nm)S.jobs.forEach(j=>j.items.forEach(i=>{if(i.film===old.name)i.film=nm}));S.films=S.films.map(x=>x.id===id?f:x)}else S.films.push(f);save();shut();render();toast("Сохранено")}
function fDel(id){const f=S.films.find(x=>x.id===id);if(S.jobs.some(j=>j.items.some(i=>i.film===f.name)))return toast("Плёнка есть в журнале — удалить нельзя");S.films=S.films.filter(x=>x.id!==id);save();shut();render()}
function vExps(){const L=[...S.exps].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,300);return `<div class="row"><h2>Расходы</h2><button class="btn" onclick="expForm()">+ Расход</button></div><p class="mu">Закупку плёнки сюда не вносите — она берётся из раздела «Плёнки».</p>`+(L.length?L.map(e=>`<div class="card tap" onclick="expForm('${e.id}')"><div class="row"><b>${E(e.cat)}</b><b>${fmt(N(e.sum))} ₽</b></div><div class="mu">${fd(e.date)}${e.desc?" · "+E(e.desc):""}</div></div>`).join(""):`<p class="mu">Пока пусто. Нажмите «+ Расход».</p>`)}
function expForm(id){const o=S.exps.find(e=>e.id===id)||null,v=o||{date:tod(),cat:S.cats[0],desc:"",sum:""};
pan(`<h2>${o?"Расход":"Новый расход"}</h2><label>Дата<input type="date" id="c_date" value="${v.date}"></label><label>Категория<select id="c_cat">${opts(S.cats,v.cat)}</select></label><label>Описание<input id="c_desc" value="${E(v.desc)}"></label><label>Сумма, ₽<input type="number" step="any" inputmode="decimal" id="c_sum" value="${v.sum}"></label>
<div class="g2"><button class="btn" onclick="eSave('${id||""}')">Сохранить</button><button class="btn gh" onclick="shut()">Отмена</button></div>${o?`<button class="btn dn" onclick="arm(this,()=>{S.exps=S.exps.filter(e=>e.id!=='${id}');save();shut();render()})">Удалить</button>`:""}`)}
function eSave(id){const g=k=>$("#c_"+k).value;if(!g("date")||N(g("sum"))<=0)return toast("Укажите дату и сумму");const e={id:id||uid(),date:g("date"),cat:g("cat"),desc:g("desc").trim(),sum:N(g("sum"))};
if(id)S.exps=S.exps.map(x=>x.id===id?e:x);else S.exps.push(e);save();shut();render();toast("Сохранено")}
const sB=(i,j,v)=>{S.bodies[i][j]=j?N(v):v;save()},sV=(i,j,v)=>{S.svcs[i][j]=j>1?N(v):v;save()},sL=(k,v)=>{S[k]=v.split("\n").map(s=>s.trim()).filter(Boolean);save()};
const add=(k,r)=>{S[k].push(r);save();render()},del=(k,i)=>{S[k].splice(i,1);save();render()};
function vSet(){return `<h2>Настройки</h2><div class="g2"><label>Курс ¥ → ₽<input type="number" step="any" value="${S.rate}" onchange="S.rate=N(this.value);save()"></label><label>Мин. остаток плёнки, м<input type="number" step="any" value="${S.minStock}" onchange="S.minStock=N(this.value);save()"></label></div><div class="g2"><label>Начало работы, ч<input type="number" value="${S.wh[0]}" onchange="S.wh[0]=N(this.value);save()"></label><label>Конец работы, ч<input type="number" value="${S.wh[1]}" onchange="S.wh[1]=N(this.value);save()"></label></div>

${S.bodies.map((b,i)=>`<div class="g5"><input value="${E(b[0])}" onchange="sB(${i},0,this.value)">${[1,2,3].map(j=>`<input type="number" step="any" value="${b[j]}" onchange="sB(${i},${j},this.value)">`).join("")}<button class="x" onclick="del('bodies',${i})">✕</button></div>`).join("")}<button class="btn gh" onclick="add('bodies',['Новый тип',2,1.5,1.5])">+ Тип кузова</button>
<h3>Услуги и цена работы</h3><p class="mu">Зона определяет расход плёнки из таблицы выше. Для «Нет» берётся фиксированный расход.</p><div class="g5 mu"><span>Услуга</span><span>Зона</span><span>Фикс. м</span><span>Цена, ₽</span><span></span></div>
${S.svcs.map((s,i)=>`<div class="g5"><input value="${E(s[0])}" onchange="sV(${i},0,this.value)"><select onchange="sV(${i},1,this.value)">${[["rear","Задняя"],["front","Передняя"],["wind","Лобовое"],["","Нет"]].map(z=>`<option value="${z[0]}"${z[0]===s[1]?" selected":""}>${z[1]}</option>`).join("")}</select><input type="number" step="any" value="${s[2]}" onchange="sV(${i},2,this.value)"><input type="number" step="any" value="${s[3]}" onchange="sV(${i},3,this.value)"><button class="x" onclick="del('svcs',${i})">✕</button></div>`).join("")}<button class="btn gh" onclick="add('svcs',['Новая услуга','',0,0])">+ Услуга</button>

const dl=async(n,d)=>{try{const k=await claude.use("downloads");if(!k){toast("Выгрузка файлов здесь недоступна");return false}await k.save({filename:n,data:d});toast("Файл сохранён");return true}catch(e){toast(e&&e.code==="declined"?"Отменено":"Не удалось сохранить файл");return false}};
